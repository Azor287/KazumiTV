name: 功能建议
description: 提出 KazumiTV 的功能或体验改进建议
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 背景或问题
      description: 这个建议想解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望 KazumiTV 如何改进？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 是否考虑过其他实现或交互方式？
  - type: checkboxes
    id: scope
    attributes:
      label: 确认事项
      options:
        - label: 这个建议不要求项目内置或分发媒体内容
          required: true
        - label: 这个建议不会要求绕过付费、登录或访问控制
          required: true
