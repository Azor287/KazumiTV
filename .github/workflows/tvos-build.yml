name: tvOS Build

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/tvos-build.yml"
      - "App/**"
      - "Models/**"
      - "Resources/**"
      - "Services/**"
      - "Sources/**"
      - "ViewModels/**"
      - "Views/**"
      - "project.yml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tvos-build.yml"
      - "App/**"
      - "Models/**"
      - "Resources/**"
      - "Services/**"
      - "Sources/**"
      - "ViewModels/**"
      - "Views/**"
      - "project.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build tvOS app
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available SDKs
        run: xcodebuild -showsdks

      - name: Build Debug for tvOS Simulator
        run: |
          xcodebuild \
            -project KazumiTV.xcodeproj \
            -scheme KazumiTV \
            -configuration Debug \
            -destination 'generic/platform=tvOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
