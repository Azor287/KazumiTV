name: External Resolver Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    name: Check Python proxy server
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify playback has no external resolver dependency
        run: |
          test ! -d kazumi-server
          test ! -e Services/Network/ServerAPI.swift
          if rg -n 'ServerAPI|serverProxyEnabled|serverProxyURL' \
            App Models Services ViewModels Views; then
            echo "External resolver dependency detected"
            exit 1
          fi
