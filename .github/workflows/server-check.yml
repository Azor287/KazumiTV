name: Server Check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    name: Check Python proxy server
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: kazumi-server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: kazumi-server/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile server sources
        run: python -m compileall api_server.py
