name: KazumiTV
options:
  bundleIdPrefix: com.kazumi
  deploymentTarget:
    tvOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.9"
    TVOS_DEPLOYMENT_TARGET: "17.0"

packages:
  Fuzi:
    url: https://github.com/cezheng/Fuzi
    from: "3.1.3"
  SQLite:
    url: https://github.com/stephencelis/SQLite.swift
    from: "0.15.3"
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: "8.1.0"

targets:
  KazumiTV:
    type: application
    platform: tvOS
    sources:
      - path: App
      - path: Sources
      - path: Views
      - path: Models
      - path: ViewModels
      - path: Services
      - path: Resources
    configFiles:
      Debug: Config/KazumiTV.xcconfig
      Release: Config/KazumiTV.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kazumi.tv
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_LAUNCHIMAGE_NAME: LaunchScreenImage
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "3"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - package: Fuzi
      - package: SQLite
      - package: Kingfisher
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: KazumiTV
        CFBundleName: KazumiTV
        CFBundleIdentifier: com.kazumi.tv
        CFBundleVersion: "2"
        CFBundleShortVersionString: "0.2.0"
        DANDANPLAY_APP_ID: "$(DANDANPLAY_APP_ID)"
        DANDANPLAY_APP_SECRET: "$(DANDANPLAY_APP_SECRET)"
        CFBundlePackageType: APPL
        CFBundleExecutable: KazumiTV
        UILaunchScreen:
          UIImageName: LaunchScreenImage
          UIImageRespectsSafeAreaInsets: false
        UIRequiredDeviceCapabilities:
          - tvOS
        UISupportedInterfaceOrientations~tvOS:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}

schemes:
  KazumiTV:
    build:
      targets:
        KazumiTV: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
