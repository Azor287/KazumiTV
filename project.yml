name: KazumiTV
options:
  bundleIdPrefix: com.kazumi
  deploymentTarget:
    tvOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "0.2.1"
    CURRENT_PROJECT_VERSION: "17"
    SWIFT_VERSION: "5.9"
    TVOS_DEPLOYMENT_TARGET: "17.0"

packages:
  Fuzi:
    url: https://github.com/cezheng/Fuzi
    from: "3.1.3"
  SQLite:
    url: https://github.com/stephencelis/SQLite.swift
    from: "0.15.3"
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: "8.1.0"
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: "2.65.0"

targets:
  KazumiTV:
    type: application
    platform: tvOS
    sources:
      - path: App
      - path: Sources
      - path: Views
      - path: Models
      - path: ViewModels
      - path: Services
      - path: Shared
      - path: Resources
    configFiles:
      Debug: Config/KazumiTV.xcconfig
      Release: Config/KazumiTV.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kazumi.tv
        INFOPLIST_FILE: Resources/Info.plist
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) KAZUMI_ENABLE_PRIVATE_WEBVIEW_RESOLVER"
        ASSETCATALOG_COMPILER_APPICON_NAME: KazumiTVAppIcon
        ASSETCATALOG_COMPILER_LAUNCHIMAGE_NAME: LaunchBrandingV2
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "3"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - target: KazumiTVTopShelf
        embed: true
      - package: Fuzi
      - package: SQLite
      - package: Kingfisher
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOHTTP1
      - package: swift-nio
        product: NIOPosix
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: KazumiTV
        CFBundleName: KazumiTV
        CFBundleIdentifier: com.kazumi.tv
        CFBundleVersion: "17"
        CFBundleShortVersionString: "0.2.1"
        DANDANPLAY_APP_ID: "$(DANDANPLAY_APP_ID)"
        DANDANPLAY_APP_SECRET: "$(DANDANPLAY_APP_SECRET)"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        CFBundlePackageType: APPL
        CFBundleExecutable: KazumiTV
        UILaunchScreen:
          UIImageName: LaunchBrandingV2
          UIImageRespectsSafeAreaInsets: false
        UIRequiredDeviceCapabilities:
          - tvOS
        UISupportedInterfaceOrientations~tvOS:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.kazumi.tv
            CFBundleURLSchemes:
              - kazumitv
  KazumiTVTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - path: TopShelf
      - path: Shared
      - path: Services/TopShelf/TopShelfRemoteSyncService.swift
      - path: Resources/Assets.xcassets/KazumiTVAppIcon.brandassets/KazumiTV Top Shelf Wide.imageset/top-shelf-wide.png
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kazumi.tv.topshelf
        PRODUCT_NAME: KazumiTVTopShelf
        INFOPLIST_FILE: TopShelf/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "3"
    info:
      path: TopShelf/Info.plist
      properties:
        CFBundleDisplayName: KazumiTV Top Shelf
        CFBundleName: KazumiTVTopShelf
        CFBundleIdentifier: com.kazumi.tv.topshelf
        CFBundleVersion: "17"
        CFBundleShortVersionString: "0.2.1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ContentProvider"
  KazumiTVTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: KazumiTVTests
    dependencies:
      - target: KazumiTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kazumi.tv.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  KazumiTV:
    build:
      targets:
        KazumiTV: all
        KazumiTVTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - KazumiTV
      targets:
        - name: KazumiTVTests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
