name: KazumiTV
options:
  bundleIdPrefix: com.kazumi
  deploymentTarget:
    tvOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TVOS_DEPLOYMENT_TARGET: "17.0"

targets:
  KazumiTV:
    type: application
    platform: tvOS
    sources:
      - path: App
      - path: Sources
      - path: Views
      - path: Models
      - path: Services
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kazumi.tv
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "3"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: KazumiTV
        CFBundleName: KazumiTV
        CFBundleIdentifier: com.kazumi.tv
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: KazumiTV
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - tvOS
        UISupportedInterfaceOrientations~tvOS:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}

schemes:
  KazumiTV:
    build:
      targets:
        KazumiTV: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
